name: LF-ReMac

options:
  bundleIdPrefix: com.alifu.lfremac
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RemoteCore:
    path: Packages/RemoteCore

targets:
  MacHost:
    type: application
    platform: macOS
    sources: [MacHost]
    dependencies:
      - package: RemoteCore
    info:
      path: MacHost/Info.plist
      properties:
        CFBundleDisplayName: LF-ReMac Host
        NSScreenCaptureUsageDescription: LF-ReMac Host streams your screen to your paired iPhone.
        LSUIElement: true
    entitlements:
      path: MacHost/MacHost.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alifu.lfremac.host
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: [MacHostTests]

  iOSClient:
    type: application
    platform: iOS
    sources: [iOSClient]
    dependencies:
      - package: RemoteCore
    info:
      path: iOSClient/Info.plist
      properties:
        CFBundleDisplayName: LF-ReMac
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: LF-ReMac finds and connects to your Mac on the local network.
        NSBonjourServices: [_lfremac._tcp]
        NSCameraUsageDescription: LF-ReMac scans the pairing code shown on your Mac.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alifu.lfremac.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [iOSClientTests]

  MacHostTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacHostTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MacHost

  iOSClientTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOSClientTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iOSClient

  iOSClientUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iOSClientUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iOSClient
    dependencies:
      - target: iOSClient

  MacHostUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacHostUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacHost
    dependencies:
      - target: MacHost

schemes:
  MacHostScreenshots:
    build:
      targets:
        MacHost: all
        MacHostUITests: [test]
    test:
      targets: [MacHostUITests]
  iOSClientScreenshots:
    build:
      targets:
        iOSClient: all
        iOSClientUITests: [test]
    test:
      targets: [iOSClientUITests]
